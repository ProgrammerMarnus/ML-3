[project]
name = "market-predictor-ml"
version = "0.2.0"
description = "ML system for predicting risk-adjusted returns and optimizing for economic usefulness"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "yfinance>=0.2.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "alpaca-py>=0.20.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
    "optuna>=3.0.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.29.0",
]
gnn = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
all = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.29.0",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

